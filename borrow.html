<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>115學年度啦啦舞借課系統</title><style>
*{box-sizing:border-box}:root{--navy:#17344f;--blue:#2f78a7;--purple:#4a51aa;--period:#42a8e6;--line:#dce6ee;--muted:#6b7885}
body{margin:0;background:#f5f7f9;color:#273847;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}
.app{max-width:1450px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,var(--navy),#2e7098);color:#fff;border-radius:18px;padding:25px 29px;margin-bottom:15px}
.hero h1{margin:0 0 7px;font-size:29px}.hero p{margin:0;opacity:.93}.home{display:inline-block;color:white;text-decoration:none;font-weight:700;margin-bottom:10px}
.card{background:white;border:1px solid #e1e8ed;border-radius:15px;padding:18px 20px;margin-bottom:15px;box-shadow:0 4px 15px #0000000a}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.grow{flex:1}.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
select,button{font:inherit;border:1px solid #cbd6de;border-radius:8px;background:white;padding:9px 11px}button{font-weight:700;cursor:pointer}.primary,.tab.active{background:#245f88;color:white;border-color:#245f88}
h2{color:var(--navy);font-size:20px;margin:0 0 12px}.sub{font-size:13px;color:var(--muted);margin-bottom:12px}.wrap{overflow:auto}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:9px;text-align:center;vertical-align:middle}th{background:#eaf3f8;color:var(--navy)}
.tag{display:inline-block;background:#edf7f5;color:#2c7066;border-radius:7px;padding:5px 8px;margin:2px;font-weight:800}.empty{text-align:center;padding:30px;color:#7a8791}
.notice{background:#fff9e9;border-left:5px solid #d6aa35;border-radius:8px;padding:13px 16px;line-height:1.8}.notice ol{margin:0;padding-left:24px}
.fixed-place{display:inline-block;background:#e8f2fa;color:#245f88;border-radius:999px;padding:7px 12px;font-weight:800}
/* timetable */
.tt{min-width:1050px;border-collapse:separate;border-spacing:4px;background:white}
.tt th,.tt td{border:0;border-radius:6px}.tt .day{background:white;color:#263746;border-bottom:1px solid #e4e9ed;padding:4px 8px 8px;font-size:15px}
.tt .day small{display:block;font-size:13px;color:#596774;margin-top:3px}.tt .period-no{background:var(--purple);color:white;width:52px;font-weight:800;line-height:1.45}.tt .time{background:var(--period);color:white;width:73px;font-weight:800;line-height:1.35}
.tt .slot{background:#eaf4fd;height:75px;min-width:125px;text-align:left;padding:9px;vertical-align:top}.tt .slot.empty-slot{background:#f6f6f6}
.class-chip{display:block;background:rgba(255,255,255,.86);border-radius:5px;padding:5px 7px;margin-bottom:4px;color:#1f67a0;font-weight:800;text-align:center}
.period-side{display:flex;gap:4px;align-items:stretch}.section-label{writing-mode:vertical-rl;text-orientation:upright;background:var(--purple);color:white;border-radius:5px;padding:8px 6px;font-weight:800;letter-spacing:2px}
@media(max-width:800px){.app{padding:9px}.hero h1{font-size:24px}}
@media print{.hero,.screen{display:none!important}.card{box-shadow:none;border:0}.app{padding:0}}
</style></head>
<body><div class="app"><header class="hero"><a href="index.html" class="home">← 回系統首頁</a><h1>115學年度啦啦舞借課系統</h1><p>201～214班｜09/03～09/11｜第1～8節｜5個練習地點</p></header>
<section class="card screen"><div class="toolbar"><button class="tab active" data-view="list">借課查詢</button><button class="tab" data-view="timetable">地點使用課表</button><div class="grow"></div><button class="primary" onclick="window.print()">列印</button></div></section>
<section id="listFilters" class="card screen"><div class="toolbar"><div class="field"><label>班級</label><select id="fc"></select></div><div class="field"><label>日期</label><select id="fd"></select></div><div class="field"><label>節次</label><select id="fp"></select></div><div class="field"><label>地點</label><select id="fl"></select></div></div></section>
<section id="ttFilters" class="card screen" style="display:none"><div class="toolbar"><div class="field"><label>查看地點</label><select id="ttLoc"></select></div><span class="sub">選擇地點後，下方以「一週課表」方式顯示，各格直接顯示班級。</span></div></section>
<section class="card"><h2 id="viewTitle">借課登記查詢</h2><div class="sub" id="summary"></div><div id="content"></div></section>
</div><script>
const A=[{"cls": "211", "date": "9/3(四)", "period": "第2節", "location": "禮堂前"}, {"cls": "213", "date": "9/3(四)", "period": "第4節", "location": "禮堂前"}, {"cls": "205", "date": "9/3(四)", "period": "第6節", "location": "禮堂前"}, {"cls": "204", "date": "9/3(四)", "period": "第6節", "location": "活動中心前"}, {"cls": "208", "date": "9/4(五)", "period": "第2節", "location": "禮堂前"}, {"cls": "204", "date": "9/4(五)", "period": "第2節", "location": "活動中心前"}, {"cls": "201", "date": "9/4(五)", "period": "第2節", "location": "韻律教室"}, {"cls": "209", "date": "9/4(五)", "period": "第5節", "location": "操場"}, {"cls": "203", "date": "9/4(五)", "period": "第5節", "location": "活動中心前"}, {"cls": "210", "date": "9/4(五)", "period": "第5節", "location": "韻律教室"}, {"cls": "210", "date": "9/4(五)", "period": "第6節", "location": "操場"}, {"cls": "205", "date": "9/4(五)", "period": "第6節", "location": "禮堂前"}, {"cls": "212", "date": "9/4(五)", "period": "第6節", "location": "活動中心前"}, {"cls": "203", "date": "9/7(一)", "period": "第1節", "location": "禮堂前"}, {"cls": "208", "date": "9/7(一)", "period": "第1節", "location": "體育組前"}, {"cls": "212", "date": "9/7(一)", "period": "第1節", "location": "活動中心前"}, {"cls": "207", "date": "9/7(一)", "period": "第2節", "location": "操場"}, {"cls": "213", "date": "9/7(一)", "period": "第5節", "location": "禮堂前"}, {"cls": "204", "date": "9/7(一)", "period": "第6節", "location": "禮堂前"}, {"cls": "205", "date": "9/7(一)", "period": "第7節", "location": "禮堂前"}, {"cls": "210", "date": "9/7(一)", "period": "第7節", "location": "體育組前"}, {"cls": "206", "date": "9/7(一)", "period": "第7節", "location": "活動中心前"}, {"cls": "210", "date": "9/8(二)", "period": "第2節", "location": "禮堂前"}, {"cls": "211", "date": "9/8(二)", "period": "第2節", "location": "活動中心前"}, {"cls": "207", "date": "9/8(二)", "period": "第3節", "location": "操場"}, {"cls": "204", "date": "9/8(二)", "period": "第3節", "location": "韻律教室"}, {"cls": "201", "date": "9/8(二)", "period": "第4節", "location": "操場"}, {"cls": "203", "date": "9/8(二)", "period": "第4節", "location": "禮堂前"}, {"cls": "202", "date": "9/8(二)", "period": "第4節", "location": "體育組前"}, {"cls": "206", "date": "9/8(二)", "period": "第4節", "location": "活動中心前"}, {"cls": "204", "date": "9/8(二)", "period": "第4節", "location": "韻律教室"}, {"cls": "207", "date": "9/8(二)", "period": "第5節", "location": "操場"}, {"cls": "208", "date": "9/8(二)", "period": "第5節", "location": "韻律教室"}, {"cls": "211", "date": "9/8(二)", "period": "第6節", "location": "禮堂前"}, {"cls": "208", "date": "9/8(二)", "period": "第6節", "location": "韻律教室"}, {"cls": "209", "date": "9/8(二)", "period": "第7節", "location": "禮堂前"}, {"cls": "208", "date": "9/8(二)", "period": "第7節", "location": "韻律教室"}, {"cls": "212", "date": "9/9(三)", "period": "第2節", "location": "韻律教室"}, {"cls": "201", "date": "9/9(三)", "period": "第5節", "location": "操場"}, {"cls": "203", "date": "9/9(三)", "period": "第5節", "location": "禮堂前"}, {"cls": "213", "date": "9/9(三)", "period": "第5節", "location": "體育組前"}, {"cls": "212", "date": "9/9(三)", "period": "第5節", "location": "活動中心前"}, {"cls": "206", "date": "9/9(三)", "period": "第6節", "location": "禮堂前"}, {"cls": "202", "date": "9/9(三)", "period": "第6節", "location": "體育組前"}, {"cls": "207", "date": "9/9(三)", "period": "第6節", "location": "韻律教室"}, {"cls": "213", "date": "9/9(三)", "period": "第7節", "location": "禮堂前"}, {"cls": "209", "date": "9/9(三)", "period": "第7節", "location": "韻律教室"}, {"cls": "206", "date": "9/10(四)", "period": "第2節", "location": "韻律教室"}, {"cls": "211", "date": "9/10(四)", "period": "第5節", "location": "操場"}, {"cls": "203", "date": "9/10(四)", "period": "第5節", "location": "禮堂前"}, {"cls": "210", "date": "9/10(四)", "period": "第5節", "location": "體育組前"}, {"cls": "205", "date": "9/10(四)", "period": "第5節", "location": "韻律教室"}, {"cls": "209", "date": "9/10(四)", "period": "第6節", "location": "韻律教室"}, {"cls": "211", "date": "9/11(五)", "period": "第5節", "location": "韻律教室"}],C=["201", "202", "203", "204", "205", "206", "207", "208", "209", "210", "211", "212", "213", "214"],D=["9/3(四)", "9/4(五)", "9/7(一)", "9/8(二)", "9/9(三)", "9/10(四)", "9/11(五)"],P=["第1節", "第2節", "第3節", "第4節", "第5節", "第6節", "第7節", "第8節"],L=["操場", "禮堂前", "體育組前", "活動中心前", "韻律教室"],T={"第1節": "8:00–8:50", "第2節": "9:00–9:50", "第3節": "10:00–10:50", "第4節": "11:00–11:50", "第5節": "13:10–14:00", "第6節": "14:10–15:00", "第7節": "15:10–16:00", "第8節": "16:10–17:00"};
const $=x=>document.getElementById(x);let view="list";
function fill(el,a,label=null){let x=label?[label,...a]:a;el.innerHTML=x.map(v=>`<option>${v}</option>`).join("")}
fill($("fc"),C,"全部班級");fill($("fd"),D,"全部日期");fill($("fp"),P,"全部節次");fill($("fl"),L,"全部地點");fill($("ttLoc"),L);
function renderList(){
 let c=$("fc").value,d=$("fd").value,p=$("fp").value,l=$("fl").value;
 let R=A.filter(r=>(c==="全部班級"||r.cls===c)&&(d==="全部日期"||r.date===d)&&(p==="全部節次"||r.period===p)&&(l==="全部地點"||r.location===l));
 $("viewTitle").textContent="借課登記查詢";$("summary").textContent=`符合條件：${R.length} 筆`;
 if(!R.length)return $("content").innerHTML='<div class="empty">目前沒有符合條件的資料。</div>';
 let h='<div class="wrap"><table><tr><th>班級</th><th>日期</th><th>節次</th><th>地點</th></tr>';
 R.forEach(r=>h+=`<tr><td><b>${r.cls}班</b></td><td>${r.date}</td><td>${r.period}</td><td><span class="tag">${r.location}</span></td></tr>`);$("content").innerHTML=h+"</table></div>";
}
function renderTT(){
 let loc=$("ttLoc").value;$("viewTitle").textContent=loc+"｜地點使用課表";$("summary").textContent="橫向為日期、直向為節次；格內顯示使用班級。";
 let h='<div class="wrap"><table class="tt"><tr><th colspan="2"></th>'+D.map(d=>`<th class="day">${d}</th>`).join("")+'</tr>';
 P.forEach((p,i)=>{h+='<tr>';h+=`<th class="period-no">${p}</th><th class="time">${T[p].replace("–","<br>～<br>")}</th>`;
 D.forEach(d=>{let R=A.filter(r=>r.location===loc&&r.date===d&&r.period===p);h+=`<td class="slot ${R.length?'':'empty-slot'}">${R.length?R.map(r=>`<span class="class-chip">${r.cls}班</span>`).join(""):""}</td>`});h+='</tr>'});
 $("content").innerHTML=h+'</table></div>';
}
function render(){view==="list"?renderList():renderTT()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));$("listFilters").style.display=view==="list"?"block":"none";$("ttFilters").style.display=view==="timetable"?"block":"none";render()});
["fc","fd","fp","fl","ttLoc"].forEach(id=>$(id).onchange=render);render();
</script></body></html>
